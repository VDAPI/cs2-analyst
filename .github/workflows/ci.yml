name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Node 24 bundles npm 11, whose `npm ci` rejects the lockfile its own
      # `npm install` produces. See "npm 10 is pinned" in CLAUDE.md.
      - name: Pin npm 10
        run: npm install -g npm@10

      - name: Install dependencies
        run: npm ci

      # Required before tsc: src/ imports @prisma/client types.
      - name: Generate Prisma client
        run: npx prisma generate

      # Each check runs even if an earlier one fails, so a single push
      # surfaces every problem instead of only the first.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Parser regression tests
        if: ${{ !cancelled() }}
        run: npm run test:clutches

      - name: Side / round-end regression tests
        if: ${{ !cancelled() }}
        run: npm run test:sides

      - name: Replay data regression tests
        if: ${{ !cancelled() }}
        run: npm run test:replay

      - name: Mechanics analysis regression tests
        if: ${{ !cancelled() }}
        run: npm run test:mechanics

      - name: Demo storage and library regression tests
        if: ${{ !cancelled() }}
        run: npm run test:library

      - name: Aim and duels analysis regression tests
        if: ${{ !cancelled() }}
        run: npm run test:aim

      - name: Platform regression tests (Premier, PL/EN, notifications)
        if: ${{ !cancelled() }}
        run: npm run test:platform

      - name: Scouting and veto regression tests
        if: ${{ !cancelled() }}
        run: npm run test:scouting

      - name: Findings and report regression tests
        if: ${{ !cancelled() }}
        run: npm run test:findings

      - name: Utility and lineups regression tests
        if: ${{ !cancelled() }}
        run: npm run test:utility

      - name: Tactics (trades, economy, positions) regression tests
        if: ${{ !cancelled() }}
        run: npm run test:tactics

      - name: Admin panel metrics regression tests
        if: ${{ !cancelled() }}
        run: npm run test:admin

      - name: Pro / rank norms regression tests
        if: ${{ !cancelled() }}
        run: npm run test:norms

      - name: Progress and sharing regression tests
        if: ${{ !cancelled() }}
        run: npm run test:progress

      - name: AI coach (plan, ratings, grounding) regression tests
        if: ${{ !cancelled() }}
        run: npm run test:coach

      - name: Training generator and lineup trainer regression tests
        if: ${{ !cancelled() }}
        run: npm run test:training

      - name: Security and privacy regression tests
        if: ${{ !cancelled() }}
        run: npm run test:security

      - name: Team (roster, dashboard, anti-strat, tactic board) regression tests
        if: ${{ !cancelled() }}
        run: npm run test:team

      - name: Win probability (features, scoring, impact, pro situations) regression tests
        if: ${{ !cancelled() }}
        run: npm run test:winprob

      - name: Role detection and "play like a pro" regression tests
        if: ${{ !cancelled() }}
        run: npm run test:roles

      - name: Clips, highlights, friends ranking and weekly challenges regression tests
        if: ${{ !cancelled() }}
        run: npm run test:social

      - name: Example analysis and onboarding regression tests
        if: ${{ !cancelled() }}
        run: npm run test:onboarding

      - name: Payments (Stripe test mode, webhooks, plans, Team seats) regression tests
        if: ${{ !cancelled() }}
        run: npm run test:billing

      - name: Parser checks on the E2E fixture demo
        if: ${{ !cancelled() }}
        run: npm run test:e2e-demo -- --fixture

  # S19: end-to-end tests in a browser, at 1280 px and 360 px. Runs in the
  # Playwright image so screenshots match the committed baselines
  # (regenerate them with `npm run test:e2e:update-snapshots`).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cs2analyst
          POSTGRES_PASSWORD: cs2analyst
          POSTGRES_DB: cs2analyst_e2e
        options: >-
          --health-cmd "pg_isready -U cs2analyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql://cs2analyst:cs2analyst@postgres:5432/cs2analyst_e2e
      E2E_REDIS_URL: redis://redis:6379/5
      # The build reads the same environment the E2E server runs with.
      DATABASE_URL: postgresql://cs2analyst:cs2analyst@postgres:5432/cs2analyst_e2e
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: e2e-only-secret-not-for-production
      E2E_FIXTURE_DEMOS: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # The image ships Node 22 with npm 10 already; pin it anyway (see CLAUDE.md).
      - name: Pin npm 10
        run: npm install -g npm@10

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: E2E tests (Playwright)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
            e2e/.state/worker.log
          retention-days: 7

  ml:
    # The Python trainer (S14): synthetic-data tests, export parity with
    # LightGBM, and the committed fixture the TypeScript scorer is tested on.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt

      - name: Install trainer dependencies
        run: python -m pip install -r ml/requirements-dev.txt

      - name: Trainer tests
        working-directory: ml
        run: python -m pytest -q
